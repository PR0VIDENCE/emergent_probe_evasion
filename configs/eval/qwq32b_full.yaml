# Full-mode eval run: concept full_n_units + concept-specific extra regimes.
#
#   uv run python scripts/run_eval.py --config configs/eval/qwq32b_full.yaml
#
# Output: data/eval_runs/qwq32b_full/
run_id: qwq32b_full
model_config: configs/models/qwq_32b.yaml
date: 2026_06
fast: false

concept_config_dir: configs/eval/concepts
universal_regimes_file: configs/eval/universal_regimes.yaml

concepts: [trees, disease, library, multiplication, deception, sycophancy]

target_layers: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60]
batch_size: 10

probe_training:
  random_seeds: [42, 123, 456, 789]
  learning_rate: 0.001
  num_epochs: 100
  weight_decay: 0.1
  patience: 10
  normalize: true

mock_fail_concepts: []
