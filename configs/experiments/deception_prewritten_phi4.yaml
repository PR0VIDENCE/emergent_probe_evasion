# Phi-4-reasoning-plus: Prewritten deception probe training
# Forward pass over prewritten completions, no model.generate()

concept: deception_prewritten
model_config: configs/models/phi4_reasoning.yaml
data_dir: data/concepts/deception_prewritten
target_layers: [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35, 38]

token_positions:
  - last_token
  - first_answer_sentence_end
  - answer_mean_pool

probe_training:
  random_seeds: [42, 123, 456, 789]
  learning_rate: 0.001
  num_epochs: 100
  weight_decay: 0.1
  patience: 10
  normalize: true
  top_k_layers: 5
  primary_position: answer_mean_pool

split:
  method: preassigned
  split_file: data/concepts/deception_prewritten/split_assignment.yaml
  train: 0.8
  val: 0.1
  test: 0.1

combiner:
  enabled: true
  regularization_C: 1.0
  output_path: configs/probes/weighted_combination_phi4_deception_prewritten.yaml

storage:
  base_dir: /workspace/deception_prewritten_data_phi4
