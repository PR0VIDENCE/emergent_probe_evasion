# Test B (test_b): random reasoning -> deceptive answer, no context [pair_ids 100-105]
# Test C (test_c): neutral reasoning -> "deceptive" answer that's actually true [pair_ids 200-205]
# Test D (test_d): random reasoning -> honest answer [pair_ids 0-5]
